<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="轮机背词·测试">
<title>轮机英语 · 背词（测试版）</title>
<style>
:root {
  --bg: #0b1014;
  --bg2: #10171d;
  --panel: #151e26;
  --panel2: #1b262f;
  --line: #24323d;
  --txt: #e8f1f4;
  --dim: #8ba0ab;
  --dim2: #5d7079;
  --acc: #35e0c9;
  --acc2: #6ee7ff;
  --ok: #38d67f;
  --bad: #ff6b6b;
  --warn: #ffc857;
  --r: 18px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { height: auto; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background:
    radial-gradient(1100px 620px at 12% -12%, #14313a 0%, transparent 60%),
    radial-gradient(900px 520px at 96% 6%, #16283f 0%, transparent 58%),
    var(--bg);
  color: var(--txt);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 18px 14px 40px;
}

.app { width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 14px; }
/* 子项一律不压缩：列表拉长时 chips / 统计不能被吃掉 */
.app > * { flex: 0 0 auto; }

/* ── 顶部 ── */
.hd { display: flex; align-items: center; gap: 12px; padding: 2px 4px; }
.brand { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.brand h1 {
  margin: 0; font-size: 17px; font-weight: 650; letter-spacing: .3px;
  display: flex; align-items: center; gap: 8px;
}
.brand h1 .dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--acc);
  box-shadow: 0 0 12px var(--acc);
}
.brand .sub { font-size: 11.5px; color: var(--dim2); letter-spacing: .4px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--panel); color: var(--dim); font-size: 16px; cursor: pointer;
  display: grid; place-items: center; transition: .18s;
}
.icon-btn:hover { color: var(--acc); border-color: #2f4756; transform: translateY(-1px); }

/* ── 统计 ── */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat {
  background: linear-gradient(180deg, var(--panel) 0%, #121a20 100%);
  border: 1px solid var(--line); border-radius: 14px; padding: 9px 10px;
}
.stat .k { font-size: 10.5px; color: var(--dim2); letter-spacing: .7px; text-transform: uppercase; }
.stat .v { font-size: 18px; font-weight: 660; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 11px; color: var(--dim2); font-weight: 400; margin-left: 2px; }
.stat.hot .v { color: var(--acc); }

/* ── 筛选 chips ── */
.chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; padding: 6px 12px; border-radius: 999px; font-size: 12.5px;
  border: 1px solid var(--line); background: var(--panel); color: var(--dim);
  cursor: pointer; transition: .16s; white-space: nowrap;
}
.chip:hover { color: var(--txt); border-color: #2f4756; }
.chip.on { background: rgba(53, 224, 201, .12); border-color: rgba(53, 224, 201, .5); color: var(--acc); }
.chip .n { opacity: .55; font-size: 11px; margin-left: 3px; }

/* 第二排：分类。单词多了以后第一排只留四个常用筛，分类单占一行横向滑 */
.chips.cats { margin-top: -7px; gap: 6px; }
/* 右边留一道渐隐，提示这排还能往左滑 */
.chips.cats {
  -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 30px), transparent 100%);
  mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 30px), transparent 100%);
}
.chip.sm { font-size: 11.5px; padding: 5px 10px; border-radius: 9px; color: var(--dim2); }
.chip.sm:hover { color: var(--txt); }
.chip.sm.on { color: var(--acc); }
.cats-label {
  flex: 0 0 auto; align-self: center; font-size: 10.5px; letter-spacing: 1px;
  color: #445a64; padding-right: 2px;
}

/* ── 模式 tabs ── */
.tabs {
  display: flex; gap: 4px; padding: 4px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 14px;
}
.tab {
  flex: 1; padding: 9px 4px; border: 0; border-radius: 11px; background: transparent;
  color: var(--dim); font-size: 13px; cursor: pointer; transition: .16s;
  font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 5px;
}
.tab:hover { color: var(--txt); }
.tab.on { background: linear-gradient(180deg, #22323d, #1a262f); color: var(--acc); box-shadow: 0 2px 10px #0006; }
.tab .kbd { font-size: 9.5px; opacity: .5; border: 1px solid currentColor; border-radius: 4px; padding: 0 3px; }

/* ── 舞台 ── */
.stage { position: relative; min-height: 340px; }

/* 卡片翻转 */
.card-wrap {
  perspective: 1600px;
  transition: transform .3s cubic-bezier(.2, .9, .3, 1), opacity .3s;
  will-change: transform;
}
.card {
  position: relative; width: 100%; min-height: 300px; transform-style: preserve-3d;
  transition: transform .5s cubic-bezier(.4, .05, .2, 1); cursor: pointer;
  touch-action: pan-y;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.card.flipped { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: var(--r); padding: 26px 22px;
  touch-action: pan-y;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  text-align: center; gap: 14px; border: 1px solid var(--line);
  background: linear-gradient(160deg, #17222b 0%, #101820 100%);
  box-shadow: 0 18px 44px -22px #000, inset 0 1px 0 #ffffff0a;
  overflow-y: auto;
}
.face::after {
  content: ""; position: absolute; inset: 0; border-radius: var(--r); pointer-events: none;
  background: radial-gradient(520px 200px at 50% 0%, rgba(53, 224, 201, .07), transparent 70%);
}
.face.back {
  transform: rotateY(180deg);
  background: linear-gradient(160deg, #16252c 0%, #101a1e 100%);
}
.cat-tag {
  font-size: 10.5px; letter-spacing: 1.2px; color: var(--dim2); text-transform: uppercase;
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px;
}
.word {
  font-size: clamp(26px, 6.4vw, 40px); font-weight: 640; line-height: 1.22;
  letter-spacing: -.4px; word-break: break-word;
}
.pos { font-size: 12.5px; color: var(--acc2); font-style: italic; opacity: .8; }
.meta-line {
  display: flex; align-items: baseline; justify-content: center; gap: 9px; flex-wrap: wrap;
  max-width: 94%;
}
.ipa {
  font-size: 15px; color: var(--acc2); opacity: .92; line-height: 1.5;
  letter-spacing: .2px; word-break: break-word;
  font-family: "Lucida Sans Unicode", "Segoe UI", "DejaVu Sans", "Arial Unicode MS", system-ui, sans-serif;
}
.hom {
  font-size: 13.5px; color: var(--dim); line-height: 1.6; max-width: 94%;
  display: flex; align-items: center; justify-content: center; gap: 7px; flex-wrap: wrap;
}
.hom.small { font-size: 12px; }
.hom-tag {
  flex: 0 0 auto; font-size: 9.5px; letter-spacing: 1.2px; color: var(--dim2);
  border: 1px solid var(--line); border-radius: 999px; padding: 1px 6px; line-height: 1.5;
}
.back-word { font-size: 12.5px; color: var(--dim2); line-height: 1.6; }
.zh { font-size: clamp(22px, 5.4vw, 32px); font-weight: 620; color: var(--txt); }
.phrase {
  font-size: 13.5px; color: var(--dim); line-height: 1.6; max-width: 92%;
  border-left: 2px solid rgba(53, 224, 201, .45); padding-left: 10px; text-align: left;
}
.hint { font-size: 11.5px; color: var(--dim2); letter-spacing: .3px; }
.card-tools {
  position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; z-index: 3;
}
.tool-btn {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--line); background: #ffffff08; color: var(--dim); cursor: pointer;
  font-size: 15px; display: grid; place-items: center; transition: .16s; padding: 0;
}
.tool-btn:hover { color: var(--acc); border-color: rgba(53, 224, 201, .5); }
.tool-btn.flip-btn { font-size: 13px; font-weight: 640; letter-spacing: .5px; }\n.tool-btn.on { color: var(--warn); border-color: rgba(255, 200, 87, .55); background: rgba(255, 200, 87, .12); }

/* 操作按钮 */
.actions { display: flex; gap: 10px; margin-top: 14px; }
.btn {
  flex: 1; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--panel); color: var(--txt); font-size: 14.5px; font-weight: 560;
  font-family: inherit; cursor: pointer; transition: .16s; display: flex;
  align-items: center; justify-content: center; gap: 7px;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.99); }
.btn.ok:hover { border-color: rgba(56, 214, 127, .6); color: var(--ok); background: rgba(56, 214, 127, .07); }
.btn.bad:hover { border-color: rgba(255, 107, 107, .6); color: var(--bad); background: rgba(255, 107, 107, .07); }
.btn.primary {
  background: linear-gradient(180deg, rgba(53, 224, 201, .18), rgba(53, 224, 201, .08));
  border-color: rgba(53, 224, 201, .45); color: var(--acc);
}
.btn.primary:hover { background: rgba(53, 224, 201, .22); }
.btn:disabled { opacity: .4; cursor: default; transform: none; }
.btn .kbd { font-size: 10px; opacity: .55; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }

/* ── 测验 ── */
.q-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 10px; }
.q-prompt {
  font-size: clamp(24px, 5.6vw, 34px); font-weight: 650; line-height: 1.25;
  padding: 22px 6px 6px; letter-spacing: -.3px;
}
.q-sub { font-size: 13px; color: var(--dim2); padding: 0 6px 16px; }
.opts { display: grid; gap: 9px; }
.opt {
  display: flex; align-items: center; gap: 11px; padding: 14px 15px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--panel); color: var(--txt);
  font-size: 15px; font-family: inherit; cursor: pointer; text-align: left; transition: .15s;
  width: 100%;
}
.opt:hover:not(.done) { border-color: #33505e; background: var(--panel2); transform: translateX(2px); }
.opt .idx {
  flex: 0 0 22px; height: 22px; border-radius: 7px; background: #ffffff0d; color: var(--dim2);
  font-size: 11.5px; display: grid; place-items: center; font-variant-numeric: tabular-nums;
}
.opt.correct { border-color: rgba(56, 214, 127, .65); background: rgba(56, 214, 127, .1); color: #b9f5d3; }
.opt.correct .idx { background: rgba(56, 214, 127, .25); color: var(--ok); }
.opt.wrong { border-color: rgba(255, 107, 107, .6); background: rgba(255, 107, 107, .1); color: #ffd2d2; animation: shake .32s; }
.opt.wrong .idx { background: rgba(255, 107, 107, .22); color: var(--bad); }
.opt.done { cursor: default; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

/* ── 拼写 ── */
.spell-box { display: flex; flex-direction: column; gap: 11px; }
.spell-input {
  width: 100%; padding: 15px 16px; border-radius: 14px; border: 1px solid var(--line);
  background: #0c131a; color: var(--txt); font-size: 19px; font-family: inherit;
  letter-spacing: .3px; outline: none; transition: .16s;
}
.spell-input:focus { border-color: rgba(53, 224, 201, .55); box-shadow: 0 0 0 3px rgba(53, 224, 201, .09); }
.spell-input.ok { border-color: rgba(56, 214, 127, .7); box-shadow: 0 0 0 3px rgba(56, 214, 127, .12); }
.spell-input.bad { border-color: rgba(255, 107, 107, .7); box-shadow: 0 0 0 3px rgba(255, 107, 107, .12); }
.feedback { font-size: 13.5px; line-height: 1.65; min-height: 22px; padding: 0 4px; }
.feedback.ok { color: var(--ok); }
.feedback.bad { color: var(--bad); }
.feedback em { color: var(--txt); font-style: normal; font-weight: 600; }

/* ── 列表 ── */
/* ── 列表 ── */
.search-box { margin-bottom: 10px; }
.search-input {
  width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: #0c131a; color: var(--txt); font-size: 14px; font-family: inherit;
  outline: none; transition: .16s;
}
.search-input:focus { border-color: rgba(53, 224, 201, .5); box-shadow: 0 0 0 3px rgba(53, 224, 201, .08); }
.search-input::placeholder { color: #4a6470; }
.search-input::-webkit-search-cancel-button { -webkit-appearance: none; height: 14px; width: 14px; background: #6d8794; cursor: pointer; border-radius: 50%; }
.phrase-hit { color: #55707d; font-style: italic; }
.search-empty { text-align: center; color: var(--dim2); font-size: 13px; padding: 34px 0; }
.list { display: flex; flex-direction: column; gap: 7px; }
.list::-webkit-scrollbar { width: 6px; }
.list::-webkit-scrollbar-thumb { background: #22323d; border-radius: 3px; }
.row {
  display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 11px;
  padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--panel); cursor: pointer; transition: .14s;
}
.row:hover { background: var(--panel2); border-color: #33505e; }
.lv { display: inline-flex; gap: 3px; vertical-align: middle; align-items: center; }
.lv i { display: block; width: 4px; height: 14px; border-radius: 2px; background: #2c3d49; }
.lv i.f { background: var(--acc); }
.row .en { font-size: 14.5px; font-weight: 560; }
.row .zh2 { font-size: 12px; color: var(--dim2); margin-top: 2px; }
.pos-inline { color: #5d7079; font-size: 11.5px; font-style: italic; font-weight: 400; }
.ipa2 {
  margin-left: 8px; font-size: 11.5px; color: #6d8794; letter-spacing: .1px;
  font-family: "Lucida Sans Unicode", "Segoe UI", "DejaVu Sans", system-ui, sans-serif;
}
.row .fav { font-size: 15px; color: var(--dim2); background: none; border: 0; cursor: pointer; padding: 4px; }
.row .fav.on { color: var(--warn); }

/* ── 进度条 ── */
.progress { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
.bar { flex: 1; height: 5px; border-radius: 3px; background: #1a252d; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--acc2), var(--acc)); transition: width .35s; }
.progress .t { font-size: 11.5px; color: var(--dim2); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ── 开屏更新横幅 ── */
.banner {
  display: none; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px;
  border: 1px solid rgba(53, 224, 201, .45);
  background: linear-gradient(180deg, rgba(53, 224, 201, .16), rgba(53, 224, 201, .06));
}
.banner.show { display: flex; }
.banner .bn-txt { flex: 1; font-size: 13px; color: var(--txt); }
.banner .bn-txt b { color: var(--acc); font-weight: 650; }
.banner .bn-go {
  border: 0; background: var(--acc); color: #06211d; font-weight: 700; font-size: 13px;
  padding: 7px 15px; border-radius: 10px; cursor: pointer; font-family: inherit;
}
.banner .bn-x {
  border: 0; background: none; color: var(--dim2); font-size: 15px; cursor: pointer; padding: 2px 4px;
}

/* ── 设置里的更新卡片与分节标题 ── */
.upd-card {
  border: 1px solid var(--line); border-radius: 16px; padding: 12px 13px; margin-bottom: 4px;
  background: linear-gradient(180deg, #16232b 0%, #111a21 100%);
}
.upd-row { display: flex; align-items: center; gap: 10px; }
.upd-cur { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.upd-cur b { font-size: 17px; color: var(--acc); font-variant-numeric: tabular-nums; }
.upd-cur small { font-size: 11.5px; color: var(--dim2); }
.mini.primary { background: rgba(53, 224, 201, .16); border-color: rgba(53, 224, 201, .5); color: var(--acc); }
.mini.primary:hover { background: rgba(53, 224, 201, .24); color: var(--acc); }
.set-sec {
  margin: 20px 0 4px; font-size: 11px; letter-spacing: 1.4px; color: #4a6470;
  border-bottom: 1px solid #1b262f; padding-bottom: 6px;
}
.log-more { margin-top: 10px; }
/* ── 设置面板 ── */
.mask {
  position: fixed; inset: 0; background: #04070acc; backdrop-filter: blur(6px);
  display: none; align-items: flex-end; justify-content: center; z-index: 50; padding: 0;
}
.mask.show { display: flex; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet {
  width: 100%; max-width: 860px; background: #111a21; border: 1px solid var(--line);
  border-radius: 22px 22px 0 0; padding: 20px 18px 26px; max-height: 88vh; overflow-y: auto;
  animation: up .24s cubic-bezier(.2, .9, .3, 1);
}
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet h3 { margin: 0 0 14px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.sheet h3 .x { margin-left: auto; background: none; border: 0; color: var(--dim2); font-size: 18px; cursor: pointer; }
.set-row {
  display: flex; align-items: center; gap: 12px; padding: 13px 0;
  border-bottom: 1px solid #1b262f;
}
.set-row:last-of-type { border-bottom: 0; }
.set-row .lab { flex: 1; font-size: 14px; }
.set-row .lab small { display: block; color: var(--dim2); font-size: 11.5px; margin-top: 3px; }
.set-row input[type="number"] {
  width: 78px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: #0c131a; color: var(--txt); font-size: 14px; font-family: inherit; text-align: center;
}
.set-row input[type="range"] { width: 130px; accent-color: var(--acc); }
.switch {
  position: relative; width: 46px; height: 26px; border-radius: 999px; background: #22323d;
  border: 1px solid var(--line); cursor: pointer; transition: .2s; flex: 0 0 auto;
}
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
  border-radius: 50%; background: #8ba0ab; transition: .2s;
}
.switch.on { background: rgba(53, 224, 201, .3); border-color: rgba(53, 224, 201, .5); }
.switch.on::after { left: 23px; background: var(--acc); }
#backupText { height: 118px; }
textarea.imp {
  width: 100%; height: 96px; margin-top: 8px; padding: 11px; border-radius: 12px;
  border: 1px solid var(--line); background: #0c131a; color: var(--txt);
  font-size: 12.5px; font-family: ui-monospace, Consolas, monospace; line-height: 1.6;
  resize: vertical; outline: none;
}
.mini-btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
/* 在线更新的地址框 */
.url-input {
  width: 100%; margin-top: 8px; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: #0c131a; color: var(--txt); font-size: 12.5px; outline: none; transition: .16s;
  font-family: ui-monospace, Consolas, "Cascadia Mono", monospace;
}
.url-input:focus { border-color: rgba(53, 224, 201, .5); box-shadow: 0 0 0 3px rgba(53, 224, 201, .08); }
.url-input::placeholder { color: #4a6470; }
.mini {
  padding: 9px 14px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel);
  color: var(--dim); font-size: 12.5px; font-family: inherit; cursor: pointer; transition: .15s;
}
.mini:hover { color: var(--txt); border-color: #33505e; }
.mini.danger:hover { color: var(--bad); border-color: rgba(255, 107, 107, .5); }
.mini.armed { color: var(--bad); border-color: rgba(255, 107, 107, .65); background: rgba(255, 107, 107, .1); }

/* 分段选择 */
.seg { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 11px; background: #0c131a; }
.seg button {
  border: 0; background: transparent; color: var(--dim2); font-size: 11.5px; font-family: inherit;
  padding: 6px 9px; border-radius: 8px; cursor: pointer; transition: .15s; white-space: nowrap;
}
.seg button:hover { color: var(--txt); }
.seg button.on { background: #22323d; color: var(--acc); }

/* ── 完成态 ── */
.done-card {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; min-height: 300px; text-align: center; border-radius: var(--r);
  border: 1px solid var(--line); background: linear-gradient(160deg, #17222b, #101820);
  padding: 30px 22px;
}
.done-card .big { font-size: 40px; }
.done-card h2 { margin: 0; font-size: 19px; }
.done-card p { margin: 0; color: var(--dim); font-size: 13.5px; line-height: 1.7; max-width: 360px; }

.foot { text-align: center; font-size: 11px; color: #3f5058; padding-top: 4px; font-variant-numeric: tabular-nums; }
.foot .ver { color: var(--acc); opacity: .7; }
/* 页面是从网上下载下来的（不是安装包自带的）就挂个小标签，方便一眼确认在线更新生效了 */
.foot .hot {
  color: var(--acc); font-size: 10px; letter-spacing: .5px; margin-left: 5px;
  border: 1px solid rgba(53, 224, 201, .38); border-radius: 4px; padding: 0 4px;
}

/* 更新日志 */
.log { margin-top: 12px; display: flex; flex-direction: column; gap: 15px; }
.log-item { border-left: 2px solid #22323d; padding-left: 12px; }
.log-item.cur { border-left-color: var(--acc); }
.log-v { font-size: 12.5px; color: var(--txt); font-weight: 620; letter-spacing: .2px; }
.log-v span { color: var(--dim2); font-weight: 400; margin-left: 9px; font-size: 11px; }
.log-list { margin: 6px 0 0; padding-left: 15px; color: var(--dim); font-size: 12px; line-height: 1.8; }
.log-list li { margin: 0; }
.log-tag {
  color: var(--acc); font-weight: 600; margin-right: 6px; font-size: 10.5px;
  border: 1px solid rgba(53, 224, 201, .35); border-radius: 4px; padding: 0 4px;
}
.log-tag.fix { color: var(--warn); border-color: rgba(255, 200, 87, .35); }

@media (min-width: 720px) {
  body { padding-top: 30px; }
  .stats { grid-template-columns: repeat(4, 1fr); }
  .stage { min-height: 380px; }
  .card { min-height: 330px; }
  .face { padding: 34px 30px; }
}
@media (max-width: 380px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .tab span.txt { display: none; }
}

  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;

}

.sbig small { font-size: 10.5px; color: var(--dim2); letter-spacing: .4px; }

.spane {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 15px 16px;
}
.spanel-t {

.sbars { display: flex; align-items: flex-end; gap: 5px; height: 96px; }

}
.sbar.zero i { background: var(--line); min-height: 2px; }
.sbar span { font-size: 9.5px; color: var(--dim2); font-variant-numeric: tabular-nums; }

.srow { display: flex; align-items: center; gap: 10px; padding: 5px 0; }

.srow .sn { flex: 0 0 58px; text-align: right; font-size: 11px; color: var(--dim2); font-variant-numeric: tabular-nums; }

      o.connect(g); g.connect(actx.destination);
      o.type = "sine";
      o.frequency.value = ok ? 660 : 200;
      g.gain.setValueAtTime(0.0001, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(ok ? 0.09 : 0.07, actx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.18);
      o.start(); o.stop(actx.currentTime + 0.2);
    } catch (e) {}
  }
  let voices = [];
  function loadVoices() { try { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; } catch (e) { voices = []; } }
  if (window.speechSynthesis) {
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  const bootAt = now();
  let ttsWarned = false;
  function ttsWarn() {
    if (ttsWarned) return;
    ttsWarned = true;
    toast("这台手机的文字转语音没就绪：系统设置 → 无障碍/语音 → 装一下英文语音包");
  }

  /* 朗读：安卓壳子里走系统 TTS（AndroidTTS），浏览器里走 Web Speech。
     Android WebView 没有 Web Speech 的实现，speechSynthesis 存在但不出声，所以必须先问原生接口。 */
  function speak(t) {
    if (!t) return;
    const text = String(t).replace(/[()（）]/g, " ").replace(/\s+/g, " ").trim();
    if (!text) return;

    if (window.AndroidTTS && typeof window.AndroidTTS.speak === "function") {
      try {
        if (!window.AndroidTTS.speak(text)) {
          const ready = window.AndroidTTS.ready ? window.AndroidTTS.ready() : false;
          if (ready || now() - bootAt > 4000) ttsWarn();
        }
        return;
      } catch (e) { /* 退到 Web Speech */ }
    }

    if (!window.speechSynthesis) { ttsWarn(); return; }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = st.ttsRate;
      const v = voices.find((x) => /^en[-_]US/i.test(x.lang)) || voices.find((x) => /^en/i.test(x.lang));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  /* 语速同步给原生 TTS（WebView 之外的安卓壳子） */
  function applyRate() {
    if (window.AndroidTTS && typeof window.AndroidTTS.setRate === "function") {
      try { window.AndroidTTS.setRate(st.ttsRate); } catch (e) {}
    }
  }

  /* ══════════ 震动 ══════════
     安卓壳子里走 AndroidHaptic（系统 Vibrator），浏览器里退到 navigator.vibrate。
     只在「手上能感觉到的地方」震：判定对错、选项对错、收藏、翻面、一轮走完、更新成功。
     打字、翻页面、开关设置都不震 —— 那些震了只会烦。 */
  function buzz(kind) {
    if (!st.haptic) return;
    const pattern = {
      tap: [0, 8],
      ok: [0, 16],
      no: [0, 26, 60, 26],
      done: [0, 30, 80, 30, 80, 70]
    }[kind] || [0, 10];
    try {
      if (window.AndroidHaptic && typeof window.AndroidHaptic.pattern === "function") {
        window.AndroidHaptic.pattern(pattern.join(","));
        return;
      }
      if (navigator.vibrate) navigator.vibrate(pattern);
    } catch (e) { /* 没有就算了 */ }
  }
  function toast(msg) {
    const d = document.createElement("div");
    d.textContent = msg;
    d.style.cssText = "position:fixed;left:50%;bottom:34px;transform:translateX(-50%);max-width:82vw;"
      + "background:#1e2c36;border:1px solid #2f4756;color:#e8f1f4;padding:10px 16px;border-radius:12px;"
      + "font-size:13px;z-index:99;box-shadow:0 12px 34px #0009;transition:opacity .28s";
    document.body.appendChild(d);
    setTimeout(() => { d.style.opacity = "0"; setTimeout(() => d.remove(), 320); }, 1500);
  }

  /* ══════════ 主题（实验 · theme） ══════════
     深色是原样。浅色只换 CSS 变量，DOM 一个字都不动，所以切来切去没有副作用。 */
  function applyTheme() {
    const day = expOn("theme") && st.theme === "light";
    document.documentElement.classList.toggle("day", day);
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", day ? "#eef4f7" : "#0b1014");
  }

  /* 「再点一次确认」的通用版：实验台、恢复内置页面都用它 */
  function armConfirmTop(btn, label, cb) {
    if (btn.dataset.armed === "1") {
      btn.dataset.armed = "";
      btn.classList.remove("armed");
      btn.textContent = label;
      cb();
      return;
    }
    btn.dataset.armed = "1";
    btn.classList.add("armed");
    btn.textContent = "再点一次";
    window.setTimeout(function () {
      if (btn.dataset.armed === "1") {
        btn.dataset.armed = "";
        btn.classList.remove("armed");
        btn.textContent = label;
      }
    }, 3500);
  }

  /* ══════════ 实验台（⚗） ══════════
     测试版的门面：每个新功能一行开关。关掉 = 回到正式版的行为，
     但已经攒下的数据（历史、进度）一条都不删 —— 只是入口不显示。 */
  let renderExp = function () {};

  function initExperiments() {
    const mask = document.createElement("div");
    mask.className = "mask";
    mask.id = "expMask";
    mask.innerHTML = '<div class="sheet">'
      + '<h3>⚗ 实验台 <button class="x" id="closeExp">✕</button></h3>'
      + '<div class="exp-note">这是测试版，跟正式版各存各的进度。新功能挂在这几个开关后面：' +
        "关掉就回到正式版的样子，词库和历史不会丢。</div>"
      + '<div id="expList"></div>'
      + '<div class="set-sec">壳子这边</div>'
      + '<div id="expShell"></div>'
      + '<div class="mini-btns" style="justify-content:center;margin-top:16px">'

      + '<div class="hint" style="text-align:center;margin-top:12px">正式版 v1.9.1 · 这一份 ' + APP_VERSION + "</div>"
      + "</div>";
    document.body.appendChild(mask);

    renderExp = function () {
      const list = mask.querySelector("#expList");
      if (!list) return;
      let html = "";
      EXPS.forEach(function (e) {
        html += '<div class="set-row"><div class="lab">' + esc(e.name) + "<small>" + esc(e.desc) + "</small></div>"
          + '<div class="switch exp-sw' + (expOn(e.id) ? " on" : "") + '" data-exp="' + esc(e.id) + '"></div></div>';
      });
      list.innerHTML = html;

      /* 壳能力：有没有原生接口，一眼看出来 */
      const hasU = updHasApp();

      let sh = '<div class="set-row"><div class="lab">热更看门狗<small>'
        + (hasU ? "开着的：换上去的页面 5 秒没回应就自动退回内置" : "只有安卓壳里有；网页版用不上")
        + "</small></div>"
        + '<span class="tag ' + (hasU ? "ok" : "off") + '">' + (hasU ? "在跑" : "不在") + "</span></div>";
      sh += '<div class="set-row"><div class="lab">这一页从哪来<small>'
        + (hotUpdated() ? "热更下来的，不是安装包自带那份" : "安装包 / 文件夹里自带的")
        + "</small></div>"
        + '<button class="mini" id="expRestore"' + (canRestore ? "" : " disabled") + ">恢复内置页面</button></div>";
      mask.querySelector("#expShell").innerHTML = sh;

      const rb = mask.querySelector("#expRestore");
      if (rb) {
        rb.addEventListener("click", function () {
          armConfirmTop(rb, "恢复内置页面", function () {
            try {
              window.AndroidUpdate.restore();

            } catch (e) { toast("退不了，壳里没这个接口"); }
          });
        });
      }
    };

    mask.querySelector("#expList").addEventListener("click", function (e) {
      const sw = e.target.closest(".exp-sw");
      if (!sw) return;
      const id = sw.dataset.exp;
      st.exp[id] = !expOn(id);
      sw.classList.toggle("on", st.exp[id]);
      save();
      if (id === "theme") applyTheme();

      refreshExpUI();

    });

    mask.querySelector("#expReset").addEventListener("click", function () {
      armConfirmTop(this, "实验全恢复默认", function () {

  /* ══════════ 在线更新 ══════════
     两条路：
     1) 内容（词库 / 页面 / 样式）—— 从电脑上的目录拉一份新的单文件 HTML，存进 App 私有目录，
        刷新页面即生效。不用重装 APK，进度（localStorage）一点不动。
     2) 安装包 —— 只有安卓壳子本身改了才需要。点一下下载，下完自动叫出系统安装器。
     接口由 MainActivity 的 UpdaterBridge 提供：window.AndroidUpdate。 */
  let updPending = null;   // 最近一次 update.json
  let updAuto = false;     // 打开软件时那一次静默检查：只提示，不自动换

  function updHasApp() {
    return !!(window.AndroidUpdate && typeof window.AndroidUpdate.check === "function");
  }
  /* 现在这页是安装包里自带的，还是从网上换下来的？
     原生那边记着下过哪个版本号，对得上就是热更新来的。 */
  function hotUpdated() {
    if (!updHasApp()) return false;
    try {
      const c = window.AndroidUpdate.contentVersion ? window.AndroidUpdate.contentVersion() : "";
      return !!c && c === APP_VERSION;
    } catch (e) { return false; }
  }
  function updBase() {
    return String(st.updateUrl || UPD_DEFAULT).replace(/\/+$/, "");
  }
  function verNewer(a, b) {
    const pa = String(a || "").split("."), pb = String(b || "").split(".");
    const n = Math.max(pa.length, pb.length);
    for (let i = 0; i < n; i++) {
      const x = parseInt(pa[i], 10) || 0, y = parseInt(pb[i], 10) || 0;
      if (x !== y) return x > y;
    }
    return false;
  }

  function refreshUpdLabels() {
    const cur = document.getElementById("updCur");
    const sub = document.getElementById("updSub");
    const go = document.getElementById("updGo");
    if (cur) cur.textContent = "v" + APP_VERSION;
    if (!sub) return;
    if (!updHasApp()) {
      sub.textContent = "网页版：刷新浏览器就是最新";
      if (go) { go.textContent = "检查更新"; go.classList.remove("primary"); }
      return;
    }
    const content = safeContentVersion();
    const app = safeAppVersion();
    sub.textContent = (content && content !== APP_VERSION ? "已热更到 " + content + " · " : "")
      + "安装包 v" + (app || "?");
    const p = pendingUpdate();
    if (go) {
      go.textContent = p ? "更新到 v" + p.v : "检查更新";
      go.classList.toggle("primary", !!p);
    }
  }

  function safeAppVersion() {
    try { return window.AndroidUpdate.appVersion ? window.AndroidUpdate.appVersion() : ""; } catch (e) { return ""; }
  }
  function safeContentVersion() {
    try { return window.AndroidUpdate.contentVersion ? window.AndroidUpdate.contentVersion() : ""; } catch (e) { return ""; }
  }

  /* 有没有新版：壳新也算，内容新也算 */
  function pendingUpdate() {
    const o = updPending;
    if (!o) return null;
    const apkNew = o.apkVersion && verNewer(o.apkVersion, safeAppVersion() || APP_VERSION);
    const htmlNew = verNewer(o.version, APP_VERSION);
    if (!apkNew && !htmlNew) return null;
    return { apk: !!apkNew, html: htmlNew, v: o.version, apkV: o.apkVersion || o.version };
  }

  function checkUpdate(auto) {
    if (!updHasApp()) {
      toast("手机 App 里才有在线更新；网页上刷新浏览器就是最新的");
      return;
    }
    updAuto = !!auto;
    if (!updAuto) { toast("正在检查…"); refreshUpdLabels(); }
    try { window.AndroidUpdate.check(updBase()); } catch (e) { toast("调不动更新接口"); }
  }

  /* 一键更新：拿现成的清单直接干，不再分两步 */
  function applyUpdate() {
    const p = pendingUpdate();
    if (!p) {
      if (updPending) { toast("已是最新 · v" + APP_VERSION); refreshUpdLabels(); }
      else checkUpdate(false);
      return;
    }
    const o = updPending;
    if (p.apk) {
      // 壳新：装壳最稳 —— 装完自带新内容，而且不用再点一次
      const name = o.apk || "lunji-words.apk";
      const url = /^https?:/i.test(name) ? name : updBase() + "/" + name;
      toast("有新安装包 v" + p.apkV + "，正在下…");
      try { window.AndroidUpdate.installApk(url); } catch (e) { toast("调不动更新接口"); }
      return;
    }
    const html = o.html || "ship-words.html";
    const url = /^https?:/i.test(html) ? html : updBase() + "/" + html;
    toast("正在下 v" + p.v + "…");
    try { window.AndroidUpdate.applyContent(url, o.version); } catch (e) { toast("调不动更新接口"); }
  }

  function installApkOnline() {
    if (!updHasApp()) { toast("网页版不用装包，刷新就是最新的"); return; }
    const name = (updPending && updPending.apk) ? updPending.apk : "lunji-words.apk";
    const url = /^https?:/i.test(name) ? name : updBase() + "/" + name;
    toast("正在下安装包…");
    try { window.AndroidUpdate.installApk(url); } catch (e) { toast("调不动更新接口"); }
    refreshUpdLabels();
  }

  function installApkOnline() {
    if (!updHasApp()) { toast("网页版不用装包，刷新就是最新的"); return; }
    const name = (updPending && updPending.apk) ? updPending.apk : "lunji-words.apk";
    const url = /^https?:/i.test(name) ? name : updBase() + "/" + name;
    toast("正在下安装包…");
    try { window.AndroidUpdate.installApk(url); } catch (e) { toast("调不动更新接口"); }
    refreshUpdLabels();
  }

  /* 原生那边的回调 */
  window.__updCheck = function (raw, err) {
    if (!raw) {
      if (!updAuto) toast("连不上：" + (err || "网络不通"));
      refreshUpdLabels();
      return;
    }
    let o = null;
    try { o = JSON.parse(raw); } catch (e) { o = null; }
    if (!o || !o.version) {
      if (!updAuto) toast("更新信息看不懂，检查一下地址");
      return;
    }
    updPending = o;
    refreshUpdLabels();
    if (updAuto) {
      const p = pendingUpdate();
      if (p) { showUpdateBanner(o, p); }
      return;
    }
    applyUpdate();
  };

  window.__updApplied = function (ok, msg) {
    if (!ok) { toast("更新没成：" + (msg || "未知原因")); return; }
    buzz("done");
    toast("已更新到 v" + ((updPending && updPending.version) || "") + "，正在重开页面");
    window.setTimeout(function () {
      try { window.AndroidUpdate.reload(); } catch (e) { try { location.reload(); } catch (e2) {} }
    }, 700);
  };

  window.__updApk = function (ok, msg) {
    if (!ok) { toast("安装包没下成：" + (msg || "未知原因")); return; }
    toast("下好了，装一下覆盖旧版，进度还在");
  };

  /* 从本地文件导入（不走网络）*/
  window.__imported = function (ok, msg) {
    if (!ok) { toast("导入没成：" + (msg || "未知原因")); return; }
    toast("导入好了 · " + (msg || "") + "，正在重开页面");
    window.setTimeout(function () {
      try { window.AndroidUpdate.reload(); } catch (e) { try { location.reload(); } catch (e2) {} }
    }, 600);
  };

  function importFromFile() {
    if (!updHasApp() || typeof window.AndroidUpdate.pickFile !== "function") {
      toast("这个安装包还不支持文件导入，装一次 1.8.2 以后的");
      return;
    }
    try { window.AndroidUpdate.pickFile(); } catch (e) { toast("打不开文件选择器"); }
  }

  /* ══════════ 开屏更新提示 ══════════
     打开 App 静默查一次，有新版就在顶部挂一条横幅：点「更新」一键装好，点 ✕ 今天不再烦你。 */
  function showUpdateBanner(o, p) {
    const el = document.getElementById("banner");
    if (!el) return;
    el.innerHTML = '<span class="bn-txt">有新版 <b>v' + esc(p.v) + "</b>"
      + (p.apk ? " · 要先装一次包" : "") + "</span>"
      + '<button class="bn-go" id="bnGo">更新</button>'
      + '<button class="bn-x" id="bnClose" title="先不更新">✕</button>';
    el.classList.add("show");
    const go = document.getElementById("bnGo");
    const x = document.getElementById("bnClose");
    if (go) go.addEventListener("click", function () { applyUpdate(); });
    if (x) x.addEventListener("click", function () { el.classList.remove("show"); });
  }

  /* ══════════ 队列 ══════════ */
  const cats = () => {
    const m = {};
    WORDS.forEach((w) => { m[w.cat || "未分类"] = (m[w.cat || "未分类"] || 0) + 1; });
    return m;
  };
  function inFilter(w) {
    if (filter === "all") return true;
    if (filter === "新词") return card(w.en).box === 0;
    if (filter === "错词") return card(w.en).wrong > 0 && card(w.en).box < 4;
    if (filter === "收藏") return !!card(w.en).fav;
    return (w.cat || "未分类") === filter;
  }
  function buildQueue() {
    const list = WORDS.filter(inFilter);
    shuffle(list);
    const t = now();
    /* 实验「错词优先排序」：打开时，错得多的排前面，压过「到期时间」这一条 */
    const wrongFirst = expOn("sortWrong");
    list.sort((x, y) => {
      const a = card(x.en), b = card(y.en);
      if (wrongFirst && a.wrong !== b.wrong) return b.wrong - a.wrong;
      if (a.box !== b.box) return a.box - b.box;
      const pa = a.due <= t ? 0 : 1, pb = b.due <= t ? 0 : 1;
      if (pa !== pb) return pa - pb;
      if ((a.wrong > 0) !== (b.wrong > 0)) return a.wrong > 0 ? -1 : 1;
      return 0;
    });
    queue = list; qpos = 0; finished = queue.length === 0;
    cardFlipped = false; quiz = null; spellState = null; listenState = null;
  }
  const cur = () => queue[qpos] || null;

  /* ══════════ 评分 ══════════ */
  function grade(ok) {
    const w = cur();
    if (!w) return;
    const c = card(w.en);
    if (ok) {
      c.right++;
      c.box = Math.min(5, c.box + 1);
      c.due = now() + BOX_DAYS[c.box] * DAY;
    } else {
      c.wrong++;
      c.box = Math.max(0, c.box - 1);
      c.due = now() + 10 * 60000;
    }
    const t = todayStr();
    if (st.today.d !== t) st.today = { d: t, n: 0 };
    st.today.n++;
    /* 统计页的数据来源：每天一行，只攒数字不攒词，体积极小 */
    const h = st.hist[t] || (st.hist[t] = { n: 0, ok: 0, ng: 0 });
    h.n++;
    if (ok) h.ok++; else h.ng++;
    if (st.streak.last !== t) {
      const y = todayStr(Date.now() - DAY);
      st.streak.n = st.streak.last === y ? (st.streak.n || 1) + 1 : 1;
      st.streak.last = t;
    }
    beep(ok);
    buzz(ok ? "ok" : "no");
    save();
  }

  function advance() {
    qpos++;
    cardFlipped = false; quiz = null; spellState = null; listenState = null;
    if (qpos >= queue.length) { finished = true; buzz("done"); }
    render();
    if (!finished && mode === "card") autoSpeakCurrent();
  }

  /* 翻面不重绘整个舞台，只切 class —— 这样才有真正的 3D 翻转动画 */
  function toggleCard() {
    if (mode !== "card" || finished || !cur()) return;
    cardFlipped = !cardFlipped;
    const el = document.querySelector(".card");
    if (el) el.classList.toggle("flipped", cardFlipped);
    buzz("tap");
    if (cardFlipped) speak(cur().en);   // 只在翻到背面时念，翻回来不重复
  }

  /* 纯翻词：只移动指针，不改变掌握度。dir = +1 下一个 / -1 上一个 */
  function step(dir) {
    if (mode !== "card" || !cur()) return false;
    const np = qpos + dir;
    if (np < 0 || np >= queue.length) return false;
    qpos = np;
    finished = false;
    cardFlipped = false;
    render();
    if (st.autoSpeak) autoSpeakCurrent();
    return true;
  }
  function autoSpeakCurrent() {
    if (st.autoSpeak && mode === "card" && cur()) speak(cur().en);
  }

  /* ══════════ 出题 ══════════ */
  function buildQuiz() {
    const w = cur(); if (!w) return;
    const dir = Math.random() < 0.5 ? "en2zh" : "zh2en";
    const field = dir === "en2zh" ? "zh" : "en";
    const pool = WORDS.filter((x) => x.en !== w.en && x[field] !== w[field]);
    shuffle(pool);
    const opts = [w[field]].concat(pool.slice(0, 3).map((x) => x[field]));
    shuffle(opts);
    quiz = { dir, field, opts, answered: false, chosen: null };
  }
  function buildListen() {
    const w = cur(); if (!w) return;
    const pool = WORDS.filter((x) => x.en !== w.en);
    shuffle(pool);
    const opts = [w.en].concat(pool.slice(0, 3).map((x) => x.en));
    shuffle(opts);
    listenState = { opts, answered: false, chosen: null };
    setTimeout(() => speak(w.en), 220);
  }

  /* ══════════ 渲染 ══════════ */
  function renderStats() {
    let mastered = 0, due = 0;
    WORDS.forEach((w) => {
      const c = card(w.en);
      if (c.box >= 3) mastered++;
      if (c.box > 0 && c.box < 5 && c.due <= now()) due++;
    });
    $("#statMastered").innerHTML = mastered + "<small>/" + WORDS.length + "</small>";
    $("#statToday").innerHTML = (st.today.d === todayStr() ? st.today.n : 0) + "<small>/" + st.perDay + "</small>";
    $("#statDue").textContent = due;
    $("#statStreak").textContent = st.streak.n || 0;
    const done = Math.min(1, (st.today.d === todayStr() ? st.today.n : 0) / st.perDay);
    $("#bar").style.width = (done * 100).toFixed(1) + "%";
    $("#ptext").textContent = Math.round(done * 100) + "%";
  }

  function renderChips() {
    const c = cats();
    const total = WORDS.length;
    const newN = WORDS.filter((w) => card(w.en).box === 0).length;
    const wrongN = WORDS.filter((w) => card(w.en).wrong > 0 && card(w.en).box < 4).length;
    const favN = WORDS.filter((w) => card(w.en).fav).length;

    /* 第一排固定四个：错词 / 收藏 在前，然后全部、新词。
       单词从 50 涨到两百多以后，分类全塞在这一排会挤成一条缝，所以分类挪到第二排。 */
    const pin = [
      { f: "错词", n: wrongN },
      { f: "收藏", n: favN },
      { f: "all", n: total, label: "全部" },
      { f: "新词", n: newN }
    ];
    let html = "";
    pin.forEach((p) => {
      html += '<button class="chip' + (filter === p.f ? " on" : "") + '" data-f="' + esc(p.f) + '">'
        + esc(p.label || p.f) + '<span class="n">' + p.n + "</span></button>";
    });
    $("#chips").innerHTML = html;

    /* 第二排：分类（含「自加」），一行横向滑动 */
    let cs = '<span class="cats-label">分类</span>';
    Object.keys(c).forEach((k) => {
      cs += '<button class="chip sm' + (filter === k ? " on" : "") + '" data-f="' + esc(k) + '">'
        + esc(k) + '<span class="n">' + c[k] + "</span></button>";
    });
    const catsEl = $("#cats");
    if (catsEl) {
      catsEl.innerHTML = cs;
      const on = catsEl.querySelector(".chip.on");
      if (on && typeof on.scrollIntoView === "function") {
        try { on.scrollIntoView({ block: "nearest", inline: "center" }); } catch (e) {}
      }
    }
  }

  function renderTabs() {
    document.querySelectorAll(".tab").forEach((b) => {
      const off = b.dataset.m === "stat" && !expOn("stat");
      b.style.display = off ? "none" : "";
      b.classList.toggle("on", b.dataset.m === mode);
    });
  }

  function doneBlock() {
    const empty = queue.length === 0;
    return '<div class="done-card"><div class="big">' + (empty ? "🫗" : "✅") + "</div>"
      + "<h2>" + (empty ? "这个范围里没词" : "这一轮走完了") + "</h2>"
      + "<p>" + (empty ? "换个分类，或者把筛选切回「全部」。" : "答过的都记进去了，掌握度低的下一轮会先出来。") + "</p>"
      + '<div style="display:flex;gap:10px;max-width:320px;width:100%">'
      + '<button class="btn primary" data-act="restart">再来一轮</button>'
      + '<button class="btn" data-act="openlist">看看列表</button></div></div>';
  }

  function renderStage() {
    const el = $("#stage");
    if (mode === "stat") { el.innerHTML = renderStat(); return; }
    if (mode === "list") { el.innerHTML = renderList(); return; }
    if (finished || !cur()) { el.innerHTML = doneBlock(); return; }
    if (mode === "card") return renderCard(el);
    if (mode === "quiz") { if (!quiz) buildQuiz(); return renderQuiz(el); }
    if (mode === "spell") return renderSpell(el);
    if (mode === "listen") { if (!listenState) buildListen(); return renderListen(el); }
  }

  function levelBar(box) {
    let s = '<span class="lv">';
    for (let i = 0; i < 5; i++) s += "<i" + (i < box ? ' class="f"' : "") + "></i>";
    return s + "</span>";
  }

  function renderCard(el) {
    const w = cur(); const c = card(w.en);
    const meta = (w.pos || w.ipa)
      ? '<div class="meta-line">'
        + (w.pos ? '<span class="pos">' + esc(w.pos) + "</span>" : "")
        + (w.ipa ? '<span class="ipa">' + esc(w.ipa) + "</span>" : "")
        + "</div>"
      : "";
    const hom = (w.hom && st.showHom)
      ? '<div class="hom"><span class="hom-tag">谐音</span>' + esc(w.hom) + "</div>"
      : "";
    const tools = '<div class="card-tools">'
      + '<button class="tool-btn' + (c.fav ? " on" : "") + '" data-act="fav" title="收藏 / 取消收藏">' + (c.fav ? "★" : "☆") + "</button>"
      + '<button class="tool-btn flip-btn" data-act="flip" title="翻面：中文 / 英文">' + (cardFlipped ? "EN" : "中") + "</button>"
      + "</div>";
    el.innerHTML =
      '<div class="card-wrap"><div class="card' + (cardFlipped ? " flipped" : "") + '" data-act="speak">'
      + '<div class="face front">'
      + tools
      + '<span class="cat-tag">' + esc(w.cat || "") + "</span>"
      + '<div class="word">' + esc(w.en) + "</div>"
      + meta + hom
      + '<div class="hint">' + levelBar(c.box) + "&nbsp; 点单词念一遍，点右上角「中」看中文</div>"
      + "</div>"
      + '<div class="face back">'
      + tools
      + '<span class="cat-tag">' + esc(w.cat || "") + "</span>"
      + '<div class="zh">' + esc(w.zh) + "</div>"
      + (w.phrase ? '<div class="phrase">' + esc(w.phrase) + "</div>" : "")
      + (w.ipa ? '<div class="back-word">' + esc(w.ipa) + "</div>" : "")
      + (w.hom && st.showHom ? '<div class="hom small"><span class="hom-tag">谐音</span>' + esc(w.hom) + "</div>" : "")
      + "</div></div></div>"
      + '<div class="actions">'
      + '<button class="btn bad" data-act="no">不认识 <span class="kbd">1</span></button>'
      + '<button class="btn ok" data-act="yes">认识 <span class="kbd">2</span></button>'
      + "</div>"
      + '<div class="hint" style="text-align:center;margin-top:12px">第 ' + (qpos + 1) + " / " + queue.length
      + " 个 · 左右滑翻词，1/2 判定 · 点单词朗读</div>";
  }

  function renderQuiz(el) {
    const w = cur(); const q = quiz;
    const prompt = q.dir === "en2zh" ? w.en : w.zh;
    const sub = q.dir === "en2zh" ? "选出它的中文意思" : "选出对应的英文";
    let opts = q.opts.map((o, i) => {
      let cls = "opt";
      if (q.answered) {
        cls += " done";
        if (o === w[q.field]) cls += " correct";
        else if (o === q.chosen) cls += " wrong";
      }
      return '<button class="' + cls + '" data-opt="' + i + '"><span class="idx">' + (i + 1) + "</span><span>" + esc(o) + "</span></button>";
    }).join("");
    el.innerHTML =
      '<div class="q-head"><span class="cat-tag">' + esc(w.cat || "") + '</span>'
      + '<span class="hint">' + (qpos + 1) + " / " + queue.length + '</span></div>'
      + '<div class="q-prompt">' + esc(prompt) + "</div>"
      + '<div class="q-sub">' + sub + (q.dir === "en2zh" && q.answered ? " · " + esc(w.phrase || "") : "") + "</div>"
      + '<div class="opts">' + opts + "</div>"
      + (q.answered
        ? '<div class="actions"><button class="btn primary" data-act="next">下一题 <span class="kbd">↵</span></button></div>'
        : '<div class="actions"><button class="btn" data-act="speak">🔊 念一遍</button></div>');
  }

  function renderSpell(el) {
    const w = cur();
    const s = spellState || { answered: false, ok: false };
    const hint = (w.zh || "") + (w.pos ? "  (" + w.pos + ")" : "");
    const len = w.en.replace(/[^A-Za-z ]/g, "").trim();
    const first = len.charAt(0).toUpperCase();
    const wordCount = len.split(/\s+/).filter(Boolean).length;
    let sub = esc(hint);
    let ph = "拼出英文";
    if (st.spellHint === "length") {
      sub += " · " + esc(len.replace(/[A-Za-z]/g, "·")) + "（" + wordCount + " 个词）";
      ph = "首字母 " + first + " 开头";
    } else if (st.spellHint === "first") {
      sub += " · 首字母 " + esc(first);
      ph = "首字母 " + first + " 开头";
    }
    el.innerHTML =
      '<div class="q-head"><span class="cat-tag">' + esc(w.cat || "") + '</span>'
      + '<span class="hint">' + (qpos + 1) + " / " + queue.length + "</span></div>"
      + '<div class="q-prompt">' + esc(w.zh) + "</div>"
      + '<div class="q-sub">' + sub + "</div>"
      + '<div class="spell-box">'
      + '<input class="spell-input" id="spellIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + esc(ph) + '"'
      + (s.answered ? " disabled" : "") + ">"
      + '<div class="feedback' + (s.answered ? (s.ok ? " ok" : " bad") : "") + '" id="fb">'
      + (s.answered ? (s.ok ? "对，就是它。" : "正确答案：<em>" + esc(w.en) + "</em>") : "&nbsp;")
      + "</div>"
      + '<div class="actions">'
      + (s.answered
        ? '<button class="btn primary" data-act="next">下一题 <span class="kbd">↵</span></button>'
        : '<button class="btn primary" data-act="submit">提交 <span class="kbd">↵</span></button>'
          + '<button class="btn" data-act="show">看答案</button>')
      + "</div></div>";
    if (!s.answered) {
      const inp = $("#spellIn");
      if (inp) setTimeout(() => inp.focus(), 30);
    }
  }

  function renderListen(el) {
    const w = cur(); const s = listenState;
    let opts = s.opts.map((o, i) => {
      let cls = "opt";
      if (s.answered) {
        cls += " done";
        if (o === w.en) cls += " correct";
        else if (o === s.chosen) cls += " wrong";
      }
      return '<button class="' + cls + '" data-opt="' + i + '"><span class="idx">' + (i + 1) + "</span><span>" + esc(o) + "</span></button>";
    }).join("");
    el.innerHTML =
      '<div class="q-head"><span class="cat-tag">' + esc(w.cat || "") + '</span>'
      + '<span class="hint">' + (qpos + 1) + " / " + queue.length + "</span></div>"
      + '<div class="q-prompt">🔊 听发音，选出你听到的词</div>'
      + '<div class="q-sub">' + (s.answered ? esc(w.zh) + " · " + esc(w.phrase || "") : "没声就点下面的按钮再放一次") + "</div>"
      + '<div class="opts">' + opts + "</div>"
      + '<div class="actions">'
      + '<button class="btn" data-act="speak">🔊 再放一次</button>'
      + (s.answered ? '<button class="btn primary" data-act="next">下一题 <span class="kbd">↵</span></button>' : "")
      + "</div>";
  }

  function matchSearch(w) {
    const q = searchText.trim().toLowerCase();
    if (!q) return true;
    const hay = (w.en + " " + w.zh + " " + (w.ipa || "") + " " + (w.phrase || "") + " " + (w.hom || "") + " " + (w.cat || "")).toLowerCase();
    return hay.indexOf(q) >= 0;
  }

  function renderRows() {
    const list = WORDS.filter(inFilter).filter(matchSearch);
    if (!list.length) {
      return '<div class="search-empty">'
        + (searchText ? "没搜到「" + esc(searchText) + "」" : "这个范围里没词")
        + "</div>";
    }
    let html = "";
    const q = searchText.trim().toLowerCase();
    list.forEach((w) => {
      const c = card(w.en);
      // 搜的是例句时，把例句也显示出来，不然看不出为什么命中
      const hitPhrase = q && (w.phrase || "").toLowerCase().indexOf(q) >= 0
        && (w.en + " " + w.zh + " " + (w.ipa || "")).toLowerCase().indexOf(q) < 0;
      html += '<div class="row" data-en="' + esc(w.en) + '">'
        + levelBar(c.box)
        + '<div><div class="en">' + esc(w.en) + " <span class=\"pos-inline\">" + esc(w.pos || "") + "</span></div>"
        + '<div class="zh2">' + esc(w.zh) + (w.ipa ? '<span class="ipa2">' + esc(w.ipa) + "</span>" : "") + "</div>"
        + (hitPhrase ? '<div class="zh2 phrase-hit">' + esc(w.phrase) + "</div>" : "")
        + "</div>"
        + '<button class="fav' + (c.fav ? " on" : "") + '" data-fav="' + esc(w.en) + '">' + (c.fav ? "★" : "☆") + "</button>"
        + "</div>";
    });
    return html;
  }

  function renderList() {
    return '<div class="search-box">'
      + '<input type="search" id="listSearch" class="search-input" placeholder="搜英文 / 中文 / 音标 / 例句"'
      + ' value="' + esc(searchText) + '" autocomplete="off" spellcheck="false"></div>'
      + '<div class="list" id="listBody">' + renderRows() + "</div>";
  }

  /* ══════════ 统计页（实验 · stat） ══════════
     数据全从 st.hist（每天一个 n/ok/ng）和 st.words 里现算，不另存一份，
     所以关掉这个实验、再打开，历史还在。 */
  function histDays(n) {
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
      const d = todayStr(Date.now() - i * DAY);
      const h = st.hist[d] || {};
      out.push({ d: d, n: h.n || 0, ok: h.ok || 0, ng: h.ng || 0 });
    }
    return out;
  }

  function renderStat() {
    const days = histDays(14);
    const maxDay = Math.max(1, days.map((x) => x.n).reduce((a, b) => Math.max(a, b), 0));

    let bars = "";
    days.forEach((x) => {
      const pct = Math.round((x.n / maxDay) * 100);
      const mmdd = x.d.slice(5);
      bars += '<div class="sbar' + (x.n ? "" : " zero") + '" data-d="' + x.d + '" data-n="' + x.n
        + '" title="' + x.d + " · " + x.n + ' 个">'
        + '<i style="height:' + pct + '%"></i>'
        + "<span>" + mmdd.slice(3) + "</span></div>";
    });

    /* 掌握度分布：box 0 是新词，5 是牢牢记住 */
    const boxN = [0, 0, 0, 0, 0, 0];
    let okAll = 0, ngAll = 0, wrongList = [];
    WORDS.forEach((w) => {
      const c = card(w.en);
      boxN[Math.max(0, Math.min(5, c.box))]++;
      okAll += c.right || 0;
      ngAll += c.wrong || 0;
      if (c.wrong > 0) wrongList.push({ w: w, c: c });
    });
    const total = okAll + ngAll;
    const acc = total ? Math.round((okAll / total) * 100) : 0;

    const boxLabels = ["新词", "刚见过", "眼熟", "会一半", "基本会", "牢固"];
    const boxRows = boxN.map((n, i) => {
      const pct = WORDS.length ? (n / WORDS.length) * 100 : 0;
      return '<div class="srow"><span class="sl">' + boxLabels[i] + "</span>"
        + '<span class="sbar2"><i style="width:' + pct.toFixed(1) + '%"></i></span>'
        + '<span class="sn">' + n + "</span></div>";
    }).join("");

    /* 分类进度 */
    const byCat = {};
    WORDS.forEach((w) => {
      const k = w.cat || "未分类";
      const o = byCat[k] || (byCat[k] = { n: 0, ok: 0 });
      o.n++;
      if (card(w.en).box >= 3) o.ok++;
    });
    const catRows = Object.keys(byCat).sort((a, b) => byCat[b].n - byCat[a].n).map((k) => {
      const o = byCat[k];
      const pct = o.n ? (o.ok / o.n) * 100 : 0;
      return '<div class="srow"><span class="sl">' + esc(k) + "</span>"
        + '<span class="sbar2"><i style="width:' + pct.toFixed(1) + '%"></i></span>'
        + '<span class="sn">' + o.ok + "/" + o.n + "</span></div>";
    }).join("");

    /* 错词榜 */
    wrongList.sort((a, b) => b.c.wrong - a.c.wrong || a.w.en.localeCompare(b.w.en));
    const wrongRows = wrongList.slice(0, 8).map((o) => {
      return '<div class="sfix" data-en="' + esc(o.w.en) + '">'
        + '<b>' + esc(o.w.en) + "</b><span>" + esc(o.w.zh) + "</span>"
        + '<em>错 ' + o.c.wrong + "</em></div>";
    }).join("");

    const sum14 = days.reduce((a, x) => a + x.n, 0);
    const streakBest = st.streak.n || 0;

    return '<div class="stat-wrap">'
      + '<div class="stat-top">'
      + '<div class="sbig"><b>' + sum14 + "</b><small>近 14 天背了</small></div>"
      + '<div class="sbig"><b>' + acc + "%</b><small>累计正确率</small></div>"
      + '<div class="sbig"><b>' + streakBest + "</b><small>连续天数</small></div>"
      + "</div>"
      + '<div class="spane"><div class="spanel-t">每天背了多少<small>点柱子看那天的数</small></div>'
      + '<div class="sbars">' + bars + "</div></div>"
      + '<div class="spane"><div class="spanel-t">掌握度<small>共 ' + WORDS.length + " 个词</small></div>" + boxRows + "</div>"
      + '<div class="spane"><div class="spanel-t">分类进度<small>会一半以上才算</small></div>' + catRows + "</div>"
      + (wrongRows
        ? '<div class="spane"><div class="spanel-t">错得最多的<small>点一下念一遍</small></div>' + wrongRows + "</div>"
        : '<div class="spane"><div class="spanel-t">错得最多的</div><div class="search-empty">还没错过词，厉害</div></div>')
      + "</div>";
  }

  /* ══════════ 导出 CSV（实验 · csv） ══════════ */
  function buildCsv() {
    const esc2 = (v) => {
      const s = String(v == null ? "" : v);
      return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const head = ["英文", "中文", "词性", "音标", "谐音", "例句", "分类", "掌握度", "对", "错", "收藏", "下次复习"];
    const rows = WORDS.filter(inFilter).map((w) => {
      const c = card(w.en);
      const due = c.due ? todayStr(c.due) : "";
      return [w.en, w.zh, w.pos || "", w.ipa || "", w.hom || "", w.phrase || "", w.cat || "",
        c.box, c.right || 0, c.wrong || 0, c.fav ? 1 : 0, due].map(esc2).join(",");
    });
    /* BOM：Excel 不认没 BOM 的 UTF-8 中文 */
    return "\ufeff" + head.join(",") + "\r\n" + rows.join("\r\n") + "\r\n";
  }

  function render() {
    if (!expOn("stat") && mode === "stat") mode = "card";
    renderStats(); renderChips(); renderTabs(); renderStage();
    $("#foot").innerHTML = WORDS.length + " 个词 · 进度就存在这台机器上 · 键盘 1 不认识 / 2 认识 / 空格翻面"
      + ' · <span class="ver">v' + APP_VERSION + "</span>"
      + (hotUpdated() ? '<span class="hot">热更</span>' : "");
  }

  /* ══════════ 交互 ══════════ */
  function submitSpell() {
    const w = cur(); if (!w || (spellState && spellState.answered)) return;
    const inp = $("#spellIn"); if (!inp) return;
    const val = inp.value;
    const alts = [w.en, w.en.replace(/\s*[（(][^)）]*[)）]/g, ""), (w.en.match(/[（(]([^)）]+)[)）]/) || [])[1] || ""]
      .map(norm).filter(Boolean);
    const ok = alts.indexOf(norm(val)) >= 0 && norm(val).length > 1;
    spellState = { answered: true, ok };
    grade(ok);
    render();
    if (ok) speak(w.en);
  }

  function pickOpt(i) {
    const w = cur(); if (!w) return;
    if (mode === "quiz" && quiz && !quiz.answered) {
      const chosen = quiz.opts[i];
      quiz.answered = true; quiz.chosen = chosen;
      const ok = chosen === w[quiz.field];
      grade(ok); render();
      if (!ok) speak(w.en);
    } else if (mode === "listen" && listenState && !listenState.answered) {
      const chosen = listenState.opts[i];
      listenState.answered = true; listenState.chosen = chosen;
      const ok = chosen === w.en;
      grade(ok); render();
      speak(w.en);
    }
  }

  /* ══════════ 卡片左右滑 ══════════ */
  let drag = null;
  let suppressClick = 0;

  function resetDrag() {
    const wrap = document.querySelector(".card-wrap");
    if (wrap) { wrap.style.transition = ""; wrap.style.transform = ""; wrap.style.opacity = ""; }
    drag = null;
  }
  function fling(visual, move) {
    const wrap = document.querySelector(".card-wrap");
    if (wrap) {
      wrap.style.transition = "transform .24s ease-out, opacity .24s";
      wrap.style.transform = "translateX(" + visual * 620 + "px) rotate(" + visual * 10 + "deg)";
      wrap.style.opacity = "0";
    }
    suppressClick = now() + 350;
    window.setTimeout(function () {
      const ok = step(move);
      if (!ok) {
        // 到边界了：把卡片拉回来
        const w2 = document.querySelector(".card-wrap");
        if (w2) {
          w2.style.transition = "transform .26s cubic-bezier(.2,.9,.3,1), opacity .26s";
          w2.style.transform = "";
          w2.style.opacity = "";
        }
        toast(move < 0 ? "已经是第一个了" : "已经是最后一个了");
      }
    }, 160);
    drag = null;
  }

  document.addEventListener("pointerdown", function (e) {
    if (mode !== "card" || finished || !cur()) return;
    if (!e.target || !e.target.closest) return;
    if (!e.target.closest(".card")) return;
    if (e.target.closest(".speak-btn")) return;
    drag = { x: e.clientX, y: e.clientY, dx: 0, moved: false };
  });

  document.addEventListener("pointermove", function (e) {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved) {
      if (Math.abs(dx) < 8) return;
      if (Math.abs(dx) <= Math.abs(dy)) { drag = null; return; }
    }
    drag.moved = true;
    drag.dx = dx;
    const wrap = document.querySelector(".card-wrap");
    if (wrap) {
      wrap.style.transition = "none";
      wrap.style.transform = "translateX(" + dx + "px) rotate(" + dx * 0.03 + "deg)";
    }
  }, { passive: true });

  document.addEventListener("pointerup", function () {
    if (!drag) return;
    const dx = drag.dx, moved = drag.moved;
    if (moved && Math.abs(dx) > 62) {
      // 向右拖 = 回到上一个（像翻相册），向左拖 = 下一个
      fling(dx > 0 ? 1 : -1, dx > 0 ? -1 : 1);
      return;
    }
    if (moved) { resetDrag(); suppressClick = now() + 120; return; }
    drag = null;
  });

  document.addEventListener("input", function (e) {

  document.addEventListener("click", function (e) {
    const t = e.target;
    if (suppressClick && now() < suppressClick) return;

    const chip = t.closest(".chip");
    if (chip) { filter = chip.dataset.f; buildQueue(); render(); return; }

    const tab = t.closest(".tab");
    if (tab) {
      mode = tab.dataset.m;
      buildQueue(); render();
      if (mode === "card") autoSpeakCurrent();
      if (mode === "listen" && !listenState) renderStage();
      return;
    }

    const fav = t.closest("[data-fav]");
    if (fav) {
      e.stopPropagation();
      const c = card(fav.dataset.fav); c.fav = !c.fav; save(); render();
      return;
    }

    const row = t.closest(".row");
    if (row) { speak(row.dataset.en); return; }

    /* 统计页：点错词排行念一遍；点柱子看那天的数 */
    const sfix = t.closest(".sfix");
    if (sfix) { speak(sfix.dataset.en); return; }
    const sbar = t.closest(".sbar");
    if (sbar) { toast(sbar.dataset.d + " · 背了 " + sbar.dataset.n + " 个"); return; }

    const opt = t.closest(".opt[data-opt]");
    if (opt) { pickOpt(Number(opt.dataset.opt)); return; }

    const act = t.closest("[data-act]");
    if (act) {
      const a = act.dataset.act;
      if (act.classList.contains("speak-btn")) e.stopPropagation();
      if (a === "fav") {
        const w = cur();
        if (!w) return;
        const cc = card(w.en);
        cc.fav = !cc.fav;
        save();
        Array.prototype.forEach.call(document.querySelectorAll('[data-act="fav"]'), (b) => {
          b.classList.toggle("on", cc.fav);
          b.textContent = cc.fav ? "★" : "☆";
        });
        renderChips();
        buzz("tap");
        toast(cc.fav ? "已收藏" : "取消收藏");
        return;
      }
      if (a === "flip") { toggleCard(); return; }
      if (a === "speak") { const w = cur(); if (w) speak(w.en); return; }
      if (a === "yes") { grade(true); advance(); return; }
      if (a === "no") { grade(false); advance(); return; }
      if (a === "next") { advance(); return; }
      if (a === "submit") { submitSpell(); return; }
      if (a === "show") {
        const w = cur();
        spellState = { answered: true, ok: false };
        grade(false); render(); speak(w.en); return;
      }
      if (a === "restart") { buildQueue(); render(); if (mode === "card") autoSpeakCurrent(); return; }
      if (a === "openlist") { mode = "list"; render(); return; }
    }

    if (t.closest("#openSet")) { $("#mask").classList.add("show"); refreshTts(); refreshUpdLabels(); refreshExpUI(); return; }
    if (t.id === "mask" || t.closest("#closeSet")) { $("#mask").classList.remove("show"); return; }

    if (t.closest("#openExp")) { $("#expMask").classList.add("show"); renderExp(); return; }
    if (t.closest("#openExp2")) { $("#mask").classList.remove("show"); $("#expMask").classList.add("show"); renderExp(); return; }
    if (t.id === "expMask" || t.closest("#closeExp")) { $("#expMask").classList.remove("show"); return; }
  });

  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.tagName === "INPUT" && e.target.type === "number") return;
    if (e.target && e.target.id === "spellIn") {
      if (e.key === "Enter") {
        if (spellState && spellState.answered) advance(); else submitSpell();
        e.preventDefault();
      }
      return;
    }
    if (e.target && e.target.tagName === "TEXTAREA") return;

    const k = e.key;

    // 拼写模式：焦点不在输入框时 Enter 也要能用
    if (mode === "spell" && cur() && !finished && k === "Enter") {
      const inp = document.getElementById("spellIn");
      if (spellState && spellState.answered) { e.preventDefault(); advance(); }
      else if (inp && document.activeElement === inp) { e.preventDefault(); submitSpell(); }
      else if (inp) { e.preventDefault(); inp.focus(); }
      return;
    }
    if (mode === "card" && cur() && !finished) {
      if (k === " ") { e.preventDefault(); toggleCard(); return; }
      if (k === "Enter") { e.preventDefault(); grade(true); advance(); return; }
      if (k === "1") { e.preventDefault(); grade(false); advance(); return; }
      if (k === "2") { e.preventDefault(); grade(true); advance(); return; }
      if (k === "ArrowLeft") { e.preventDefault(); step(-1); return; }
      if (k === "ArrowRight") { e.preventDefault(); step(1); return; }
      if (k === "r" || k === "R") { speak(cur().en); return; }
    }
    if ((mode === "quiz" || mode === "listen") && cur() && !finished) {
      if (/^[1-4]$/.test(k)) {
        e.preventDefault();
        const answered = mode === "quiz" ? (quiz && quiz.answered) : (listenState && listenState.answered);
        if (answered && k === "1") { advance(); return; }
        pickOpt(Number(k) - 1);
        return;
      }
      if (k === "Enter") {
        const answered = mode === "quiz" ? (quiz && quiz.answered) : (listenState && listenState.answered);
        if (answered) { e.preventDefault(); advance(); }
        return;
      }
      if (k === "r" || k === "R") { speak(cur().en); return; }
    }
  });

  function copyToClipboard(text, okMsg) {
    const s = String(text == null ? "" : text);
    if (window.AndroidTTS && typeof window.AndroidTTS.copy === "function") {
      try { window.AndroidTTS.copy(s); toast(okMsg); return; } catch (e) { /* 退到网页那条路 */ }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(s).then(
        function () { toast(okMsg); },
        function () { toast("复制不了，长按文本框全选复制"); }
      );
      return;
    }
    toast("复制不了，长按文本框全选复制");
  }

      mask.querySelector("#imp").value = "";
      rebuildWordlist(); buildQueue(); save(); render();
      toast(n ? "加了 " + n + " 个词" : "一行都没认出来，格式是  英文 | 中文");
    });

    mask.querySelector("#exportProg").addEventListener("click", () => {
      const bk = mask.querySelector("#backupText");
      bk.value = JSON.stringify(st);
      bk.focus();
      bk.setSelectionRange(0, bk.value.length);
      toast("生成了，点「复制」带走");
    });

    mask.querySelector("#copyProg").addEventListener("click", () => {
      const bk = mask.querySelector("#backupText");
      if (!bk.value) { toast("先点「导出」"); return; }
      if (window.AndroidTTS && typeof window.AndroidTTS.copy === "function") {
        try { window.AndroidTTS.copy(bk.value); toast("复制好了"); return; } catch (e) {}
      }
      bk.focus();
      bk.setSelectionRange(0, bk.value.length);
      let done = false;
      try { done = document.execCommand("copy"); } catch (e) { done = false; }
      if (done) { toast("复制好了"); return; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(bk.value).then(
          () => toast("复制好了"),
          () => toast("复制不了，长按文本框全选复制")
        );
        return;
      }
      toast("复制不了，长按文本框全选复制");
    });

    mask.querySelector("#importProg").addEventListener("click", function () {
      const bk = mask.querySelector("#backupText");
      const raw = bk.value.trim();
      if (!raw) { toast("先把备份文字粘贴到框里"); return; }
      let obj = null;
      try { obj = JSON.parse(raw); } catch (e) { obj = null; }
      if (!obj || typeof obj !== "object" || !obj.words) { toast("这段不像备份内容"); return; }
      armConfirm(this, "恢复", () => {
        const merged = Object.assign(fresh(), obj);
        if (!merged.words || typeof merged.words !== "object") merged.words = {};
        if (!Array.isArray(merged.custom)) merged.custom = [];
        if (typeof merged.showHom !== "boolean") merged.showHom = true;
        if (["none", "first", "length"].indexOf(merged.spellHint) < 0) merged.spellHint = "first";
        if (!merged.today || merged.today.d !== todayStr()) merged.today = { d: todayStr(), n: 0 };
        st = merged;
        st.lastVersion = APP_VERSION;
        save(); rebuildWordlist(); buildQueue(); render();
        toast("恢复完成，共 " + WORDS.length + " 个词");
      });
    });

    mask.querySelector("#resetToday").addEventListener("click", function () {
      armConfirm(this, "清零", () => {
        st.today = { d: todayStr(), n: 0 };
        save(); render();
        toast("今日进度清零了");
      });
    });

    mask.querySelector("#resetProg").addEventListener("click", function () {
      armConfirm(this, "清空进度", () => {
        const keepCustom = st.custom.slice();
        const keepSet = {
          perDay: st.perDay, autoSpeak: st.autoSpeak,
          sound: st.sound, showHom: st.showHom, spellHint: st.spellHint
        };
        st = fresh();
        st.custom = keepCustom;
        Object.assign(st, keepSet);
        save(); rebuildWordlist(); buildQueue(); render();
        toast("进度清空了，词库还在");
      });
    });
  }

  /* ══════════ 启动 ══════════ */
  let storageOK = true;
  try {
    localStorage.setItem(KEY + "__probe", "1");
    localStorage.removeItem(KEY + "__probe");
  } catch (e) { storageOK = false; }

  rebuildWordlist();
  if (!WORDS.length) {
    document.body.innerHTML = '<div class="done-card" style="margin:40px auto;max-width:520px"><div class="big">📄</div><h2>没读到词库</h2><p>words.js 和 index.html 要放在同一个文件夹里。</p></div>';
    return;
  }
  initSettings();
  initExperiments();
  applyTheme();
  applyRate();
  buildQueue();
  render();
  if (!storageOK) {
    setTimeout(function () {
      toast("这个打开方式存不住进度，用浏览器打开这个文件就正常了");
    }, 800);
  }
  if (st.lastVersion !== APP_VERSION) {
    const upgraded = Object.keys(st.words || {}).length > 0;
    st.lastVersion = APP_VERSION;
    save();
    setTimeout(function () {
      toast(upgraded
        ? "已更新到 v" + APP_VERSION + "，⚙ 里能看这次改了什么"
        : "欢迎 · v" + APP_VERSION + "，⚙ 里有更新日志");
    }, storageOK ? 1100 : 5000);
  }

  /* 安卓壳子里：安静地看一眼有没有新版内容，有就提示一句，不自动换 */
  if (updHasApp()) {
    setTimeout(function () { refreshUpdLabels(); checkUpdate(true); }, 2200);
  }

  window.__se = { get st() { return st; }, rebuild: rebuildWordlist, checkUpdate: checkUpdate, applyUpdate: applyUpdate, pending: pendingUpdate, reset: function () { updPending = null; } };
  /* 测试版多暴露几样给回归测试用 */
  window.__beta = {
    get ver() { return APP_VERSION; },
    exps: EXPS, expOn: expOn, histDays: histDays, buildCsv: buildCsv,
    applyTheme: applyTheme, save: save
  };

  /* 喘口气给壳子看：安卓壳里的看门狗 6 秒等不到这一声，就判定这页坏了、退回内置页面。
     这是「热更兜底」的页面那一半 —— 一定要放在所有初始化之后。 */
  window.__ready = true;
  try {
    if (window.AndroidUpdate && typeof window.AndroidUpdate.heartbeat === "function") {
      window.AndroidUpdate.heartbeat();
    }
  } catch (e) { /* 网页版没有壳，正常 */ }
})();

  </script>
</body>
</html>
